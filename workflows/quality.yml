name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run syntax
      - run: npm test
      - run: npm run check
      - run: npm run audit:sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hyperdrive.sarif
